<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10264F" />
    <title>Offline · CampusLink</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#182847;font:16px system-ui,sans-serif}
      .card{max-width:420px;margin:24px;padding:32px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 50px #10264f12}
      .mark{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#10264f;color:#d5ae55;font-weight:800}
      .card h1{font-size:26px}.card p{color:#69758b;line-height:1.6}
      .card button{border:0;border-radius:10px;padding:12px 16px;background:#10264f;color:white;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark">CL</div><h1>You’re offline</h1><p>CampusLink needs a connection to load this page. Your saved preview data remains on this device.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
