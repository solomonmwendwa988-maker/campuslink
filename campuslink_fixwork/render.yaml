services:
  - type: web
    name: campuslink-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate -w apps/api && npm run build -w apps/api
    startCommand: npm run db:migrate:deploy -w apps/api && npm run start -w apps/api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: LAUNCH_UNIVERSITY_SLUG
        value: university-of-kabianga
